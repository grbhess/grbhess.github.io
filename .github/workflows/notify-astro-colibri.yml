# Emails Astro-COLIBRI about every commit that changes obstable.csv.
#
# GitHub retired its own push notification emails on 2026-10-15. Astro-COLIBRI
# read those emails to learn that H.E.S.S. follows up (or cancels) a GRB, so
# this workflow sends the same email through an SMTP account instead.
#
# Install as .github/workflows/notify-astro-colibri.yml in
# grbhess/grbhess.github.io. Repository secrets it reads:
#   ASTRO_COLIBRI_SMTP_HOST      e.g. smtp.gmail.com
#   ASTRO_COLIBRI_SMTP_PORT      optional: 587 (STARTTLS, default) or 465 (TLS)
#   ASTRO_COLIBRI_SMTP_USERNAME  account that sends the email
#   ASTRO_COLIBRI_SMTP_PASSWORD  its password (an app password for Gmail)
#   ASTRO_COLIBRI_MAIL_TO        recipients, comma separated: the mailbox the
#                                Astro-COLIBRI listener reads, plus anybody
#                                who wants a copy
#   ASTRO_COLIBRI_MAIL_FROM      optional: sender address, default the username
#
# The Astro-COLIBRI listener depends on three properties of the email. Keep
# them when editing: the subject contains the repository name, the body is
# plain text only (no HTML part), and the body has one "Commit: <40 hex>" line.
# That is why there is one email per commit.

name: Notify Astro-COLIBRI (email)

on:
  push:
    branches: ["main"]
    paths:
      - "obstable.csv"
  workflow_dispatch:
    inputs:
      commits:
        description: "Commit SHAs to send again, separated by spaces"
        required: true
        type: string
      dry_run:
        description: "Print the emails to the log instead of sending them"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Send one email per commit
        env:
          SMTP_HOST: ${{ secrets.ASTRO_COLIBRI_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.ASTRO_COLIBRI_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.ASTRO_COLIBRI_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.ASTRO_COLIBRI_SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.ASTRO_COLIBRI_MAIL_TO }}
          MAIL_FROM: ${{ secrets.ASTRO_COLIBRI_MAIL_FROM }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          MANUAL_COMMITS: ${{ inputs.commits }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          import smtplib
          import ssl
          import subprocess
          import sys
          from email.message import EmailMessage
          from email.utils import formataddr, formatdate

          TABLE = "obstable.csv"
          REPO = os.environ["GITHUB_REPOSITORY"]
          SERVER = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          REF = os.environ.get("GITHUB_REF", "refs/heads/main")
          DRY_RUN = os.environ.get("DRY_RUN", "").lower() == "true"


          def git(*args):
              done = subprocess.run(
                  ["git", *args], check=True, capture_output=True, text=True
              )
              return done.stdout.strip()


          def touches_table(sha):
              changed = git("diff-tree", "--no-commit-id", "--name-only", "-r", "--root", sha)
              return TABLE in changed.splitlines()


          def commits_to_send():
              manual = os.environ.get("MANUAL_COMMITS", "").split()
              if manual:
                  return [git("rev-parse", "--verify", sha + "^{commit}") for sha in manual]

              before = os.environ.get("PUSH_BEFORE", "")
              after = os.environ["PUSH_AFTER"]
              # A new branch has an all-zero "before", a force push one that is
              # not an ancestor: only the pushed head is known to be new then.
              is_ancestor = bool(before.strip("0")) and (
                  subprocess.run(
                      ["git", "merge-base", "--is-ancestor", before, after],
                      capture_output=True,
                  ).returncode
                  == 0
              )
              if is_ancestor:
                  pushed = git(
                      "rev-list", "--reverse", "--no-merges", before + ".." + after
                  ).split()
              else:
                  pushed = [after]
              return [sha for sha in pushed if touches_table(sha)]


          def build_message(sha, sender, recipients):
              author, date, title = git("show", "-s", "--format=%an%n%aD%n%s", sha).split(
                  "\n", 2
              )
              log = git("show", "-s", "--format=%B", sha)
              # Plain ASCII keeps the subject in one unencoded header.
              title = title.encode("ascii", "replace").decode()[:100]
              body = "\n".join(
                  [
                      "  Branch: " + REF,
                      "  Home:   " + SERVER + "/" + REPO,
                      "  Commit: " + sha,
                      "      " + SERVER + "/" + REPO + "/commit/" + sha,
                      "  Author: " + author,
                      "  Date:   " + date,
                      "",
                      "  Changed paths:",
                      "    M " + TABLE,
                      "",
                      "  Log Message:",
                      "  -----------",
                      *("  " + line for line in log.splitlines()),
                      "",
                      "Sent by the GitHub Actions workflow of " + REPO + " for Astro-COLIBRI.",
                      "",
                  ]
              )
              message = EmailMessage()
              message["Subject"] = "[" + REPO + "] " + sha[:6] + ": " + title
              message["From"] = formataddr(("H.E.S.S. GRB table", sender))
              message["To"] = ", ".join(recipients)
              message["Date"] = formatdate(usegmt=True)
              message.set_content(body)  # one text/plain part, no HTML alternative
              return message


          def send(messages):
              host = os.environ["SMTP_HOST"]
              port = int(os.environ.get("SMTP_PORT") or 587)
              context = ssl.create_default_context()
              if port == 465:
                  server = smtplib.SMTP_SSL(host, port, context=context, timeout=60)
              else:
                  server = smtplib.SMTP(host, port, timeout=60)
              with server:
                  if port != 465:
                      server.starttls(context=context)
                  server.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
                  for message in messages:
                      server.send_message(message)
                      print("Sent: " + message["Subject"])


          def main():
              required = ["MAIL_TO"] if DRY_RUN else [
                  "SMTP_HOST", "SMTP_USERNAME", "SMTP_PASSWORD", "MAIL_TO"
              ]
              missing = [name for name in required if not os.environ.get(name)]
              if missing:
                  sys.exit(
                      "Missing repository secrets: "
                      + ", ".join("ASTRO_COLIBRI_" + name for name in missing)
                  )

              # Plain addresses separated by commas, semicolons or line breaks.
              # Not email.utils.getaddresses: since Python 3.13 it rejects the
              # whole list for one stray separator, such as the line break a
              # pasted secret often ends with.
              recipients = [
                  entry.strip("<>")
                  for entry in re.split(r"[,;\s]+", os.environ["MAIL_TO"])
                  if "@" in entry
              ]
              if not recipients:
                  sys.exit("ASTRO_COLIBRI_MAIL_TO holds no email address")

              sender = os.environ.get("MAIL_FROM") or os.environ.get("SMTP_USERNAME") or "dry-run@example.org"
              commits = commits_to_send()
              if not commits:
                  print("No commit in this push changes " + TABLE + ": nothing to send.")
                  return
              messages = [build_message(sha, sender, recipients) for sha in commits]
              if DRY_RUN:
                  for message in messages:
                      sys.stdout.buffer.write(message.as_bytes())
                      sys.stdout.buffer.write(b"\n" + b"=" * 72 + b"\n")
                  return
              send(messages)


          main()
          PYTHON
